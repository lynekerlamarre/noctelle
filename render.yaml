services:
  - type: web
    runtime: static
    name: noctelle
    buildCommand: echo "Plain HTML, no build step"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
